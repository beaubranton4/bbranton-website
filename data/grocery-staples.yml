# grocery-staples.yml — the default grocery list + the unit economics behind it.
#
# Three jobs:
#   1. `default_list: true` items ARE Beau's default weekly grocery list — the
#      "just buy this" baseline when there's no specific meal plan.
#   2. Every item carries per-unit nutrition, retail package size, and price so
#      `scripts/grocery-plan.mjs` can answer "how much should I buy?" deterministically.
#   3. `grazeable: true` marks the overeat risk. The grocery-planning skill's rule
#      "grazeable carbs <= ~25% of the envelope" is enforced FROM THIS FLAG, so the
#      cap is computed, not eyeballed.
#
# PROVENANCE — read before trusting a number:
#   * `price_usd` on items marked `source: receipt` are PAID prices from the
#     validated 2026-08-09 Whole Foods (Franklin St SF) shop — see
#     .claude/skills/grocery-planning/references/baseline-week-2026-08-09.md
#   * `per_unit` marked `source: logged` are Beau's OWN numbers from
#     data/widgets/calorie.json (21 logged days), so the planner and the
#     food-logging skill can never disagree about what an apple is.
#   * `source: reference` = standard USDA-ish anchor, no receipt or log behind it.
#     These are the ones to correct first.
#
# `unit` is the *nutrition* basis (how Beau logs it). `package` is the *purchase*
# basis (how the store sells it). The planner converts between them — that gap is
# where "I bought a 5 lb bag for a 1.3 lb recipe" overage comes from.
#
# `yield_cooked`: 1 lb raw chicken does not put 1 lb of food on the plate. The
# planner divides by this to get raw purchase weight.
#
# `role` drives the solver: protein is held at the floor and NEVER scaled down to
# hit a calorie target. carb/fat/flex are the dials it turns to close a gap.

meta:
  updated: 2026-08-09
  store_default: "Whole Foods — Franklin St, SF"
  currency: USD
  baseline_shop: ".claude/skills/grocery-planning/references/baseline-week-2026-08-09.md"
  baseline_total_usd: 189.09
  note: >
    Seeded from 21 days of logged eating and reconciled against the 2026-08-09
    receipt. This is the ONE list — if a new default emerges, edit this file
    rather than starting a second list somewhere else.

