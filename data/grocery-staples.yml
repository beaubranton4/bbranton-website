# ---------------------------------------------------------------------------
# DEFAULT BASKET — "just buy this."
#
# Quantities are in each item's `unit`, sized for BEAU ALONE for one 5-weekday
# week, back-derived from his share of the validated 2026-08-09 shop. This is the
# answer to "what's my default grocery list?" with numbers attached.
#
# The planner scales this: Abby is added by her own envelope ratio, a 3-day week
# scales by 3/5, and `--default` trims the carb/fat/flex dials until the basket
# fits the calorie envelope. Protein quantities are the floor and never scale down.
#
# `pantry: true` = usually already on hand; excluded from a weekly buy unless
# `--restock` is passed. These are the bulk items whose package size would
# otherwise blow up the basket (a 5 lb rice bag is 7,400 cal).
# ---------------------------------------------------------------------------
